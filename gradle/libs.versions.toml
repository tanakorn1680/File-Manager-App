[versions]
# Core toolchain versions below (agp, kotlin, coreKtx, appcompat, material,
# coroutines) are copied as-is from a Raov-guide project the user already
# built successfully via GitHub Actions — kept identical rather than
# upgraded to whatever is "latest" today, since that combination is the
# one actually confirmed to work on a GitHub Actions runner.
agp          = "8.3.2"
kotlin       = "1.9.23"
coreKtx      = "1.13.1"
appcompat    = "1.7.0"
material     = "1.12.0"
recyclerview = "1.3.2"
coordinatorlayout = "1.2.0"
constraintlayout = "2.1.4"
coroutines   = "1.7.3"
lifecycle    = "2.8.0"
okhttp       = "4.12.0"
securityCrypto = "1.1.0"
swiperefresh = "1.1.0"
activity     = "1.9.0"

[libraries]
androidx-core-ktx        = { group = "androidx.core",           name = "core-ktx",                 version.ref = "coreKtx" }
androidx-appcompat       = { group = "androidx.appcompat",      name = "appcompat",                version.ref = "appcompat" }
material                 = { group = "com.google.android.material", name = "material",             version.ref = "material" }
androidx-recyclerview    = { group = "androidx.recyclerview",   name = "recyclerview",             version.ref = "recyclerview" }
androidx-swiperefresh    = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout",   version.ref = "swiperefresh" }
androidx-coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout",  version.ref = "coordinatorlayout" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout",     version.ref = "constraintlayout" }
androidx-activity        = { group = "androidx.activity",       name = "activity-ktx",             version.ref = "activity" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
okhttp                   = { group = "com.squareup.okhttp3",    name = "okhttp",                   version.ref = "okhttp" }
androidx-security-crypto = { group = "androidx.security",       name = "security-crypto",          version.ref = "securityCrypto" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
